name: Publish OpenWrt SDK images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/actions/openwrt-sdk-rust/Dockerfile
      - .github/actions/openwrt-sdk-rust/entrypoint.sh
      - .github/workflows/prepare-sdk-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-openwrt-sdk-images
  cancel-in-progress: true

env:
  SDK_IMAGE: ghcr.io/reticulum-spb/openwrt-rns-sdk-rust

jobs:
  publish:
    name: Publish ${{ matrix.sdk_arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_arch: aarch64_cortex-a53-25.12.5
            rust_target: aarch64-unknown-linux-musl
          - sdk_arch: x86_64-25.12.5
            rust_target: x86_64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish SDK image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .github/actions/openwrt-sdk-rust
          push: true
          tags: ${{ env.SDK_IMAGE }}:${{ matrix.sdk_arch }}-rust-1.94.0
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            CONTAINER=ghcr.io/openwrt/sdk
            ARCH=${{ matrix.sdk_arch }}
            RUST_TARGET=${{ matrix.rust_target }}
          cache-from: type=gha,scope=sdk-${{ matrix.sdk_arch }}
          cache-to: type=gha,mode=max,scope=sdk-${{ matrix.sdk_arch }}
