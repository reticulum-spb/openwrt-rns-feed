name: Build OpenWrt feed

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-feed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: 25.12.5
  RUST_VERSION: 1.94.0
  FEED_NAME: rns
  BUILDER_IMAGE: ghcr.io/reticulum-spb/openwrt-rns-sdk-rust
  PACKAGES: >-
    rs-reticulum
    rs-lxmf
    rs-nodepage
    rs-rrcd
    rs-nomadnet

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: bcm27xx-bcm2710
            package_arch: aarch64_cortex-a53
            openwrt_build_dir: target-aarch64_cortex-a53_musl
            rust_target: aarch64-unknown-linux-musl

          - target: rockchip-armv8
            package_arch: aarch64_generic
            openwrt_build_dir: target-aarch64_generic_musl
            rust_target: aarch64-unknown-linux-musl

          - target: sunxi-cortexa7
            package_arch: arm_cortex-a7_neon-vfpv4
            openwrt_build_dir: target-arm_cortex-a7+neon-vfpv4_musl_eabi
            rust_target: armv7-unknown-linux-musleabihf

#          - target: kirkwood-generic
#            package_arch: arm_xscale
#            openwrt_build_dir: target-arm_xscale_musl_eabi
#            rust_target: armv5te-unknown-linux-musleabi

    steps:
      - name: Check out feed
        uses: actions/checkout@v7

      - name: Restore OpenWrt and Cargo cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/openwrt-cache/${{ matrix.target }}
          key: openwrt-builder-${{ runner.os }}-${{ matrix.target }}-${{ env.OPENWRT_VERSION }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('packages/**/Makefile', '.github/actions/openwrt-sdk-rust/**') }}
          restore-keys: |
            openwrt-builder-${{ runner.os }}-${{ matrix.target }}-${{ env.OPENWRT_VERSION }}-rust-${{ env.RUST_VERSION }}-

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Build packages and index
        uses: ./.github/actions/openwrt-sdk-rust
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          BUILD_LOG: 1
          BUILDER_IMAGE: ${{ env.BUILDER_IMAGE }}
          CACHE_DIR: ${{ runner.temp }}/openwrt-cache/${{ matrix.target }}
          FEED_DIR: ${{ github.workspace }}
          FEEDNAME: ${{ env.FEED_NAME }}
          INDEX: 1
          OPENWRT_BUILD_DIR: ${{ matrix.openwrt_build_dir }}
          OPENWRT_SDK_TAG: ${{ matrix.target }}-${{ env.OPENWRT_VERSION }}
          PACKAGES: ${{ env.PACKAGES }}
          PRIVATE_KEY: ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
          RNS_EXTERNAL_RUST: 1
          RUST_TARGET: ${{ matrix.rust_target }}
          RUST_VERSION: ${{ env.RUST_VERSION }}
          V: s

      - name: Stage binary feed
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          source_dir="artifacts/bin/packages/${PACKAGE_ARCH}/${FEED_NAME}"
          target_dir="publish/${OPENWRT_VERSION}/${PACKAGE_ARCH}/${FEED_NAME}"

          test -f "${source_dir}/packages.adb"
          mkdir -p "${target_dir}"
          cp -a "${source_dir}/." "${target_dir}/"

      - name: Upload architecture feed
        uses: actions/upload-artifact@v7
        with:
          name: feed-${{ matrix.target }}
          path: publish/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.target }}
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  deploy-pages:
    name: Deploy feed to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download architecture feeds
        uses: actions/download-artifact@v8
        with:
          pattern: feed-*
          path: pages
          merge-multiple: true

      - name: Check GitHub Pages size limit
        shell: bash
        run: |
          size_bytes="$(du -sb pages | cut -f1)"
          limit_bytes=$((1024 * 1024 * 1024))

          echo "Pages payload: $(numfmt --to=iec-i --suffix=B "$size_bytes")"
          if (( size_bytes > limit_bytes )); then
            echo "::error::GitHub Pages payload exceeds the 1 GiB limit"
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
