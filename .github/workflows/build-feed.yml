name: Build OpenWrt feed

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-feed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: 25.12.5
  FEED_NAME: rns
  SDK_IMAGE: ghcr.io/reticulum-spb/openwrt-rns-sdk-rust
  PACKAGES: >-
    rs-reticulum
    rs-lxmf
    rs-nodepage
    rs-rrcd
    rs-nomadnet

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: raspberry-pi-3
            sdk_arch: aarch64_cortex-a53-25.12.5
            package_arch: aarch64_cortex-a53
            target_build_dir: target-aarch64_cortex-a53_musl
            rust_target: aarch64-unknown-linux-musl
          - id: x86-64
            sdk_arch: x86_64-25.12.5
            package_arch: x86_64
            target_build_dir: target-x86_64_musl
            rust_target: x86_64-unknown-linux-musl

    steps:
      - name: Check out feed
        uses: actions/checkout@v7

      - name: Restore OpenWrt and Cargo cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/openwrt-cache/${{ matrix.id }}
          key: openwrt-rust-${{ runner.os }}-${{ matrix.sdk_arch }}-${{ hashFiles('packages/**/Makefile', '.github/actions/openwrt-sdk-rust/**') }}
          restore-keys: |
            openwrt-rust-${{ runner.os }}-${{ matrix.sdk_arch }}-

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Build packages and index
        uses: ./.github/actions/openwrt-sdk-rust
        env:
          ARCH: ${{ matrix.sdk_arch }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          BUILD_LOG: 1
          CACHE_DIR: ${{ runner.temp }}/openwrt-cache/${{ matrix.id }}
          FEED_DIR: ${{ github.workspace }}
          FEEDNAME: ${{ env.FEED_NAME }}
          INDEX: 1
          PACKAGES: ${{ env.PACKAGES }}
          PRIVATE_KEY: ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
          RNS_EXTERNAL_RUST: 1
          RUST_TARGET: ${{ matrix.rust_target }}
          TARGET_BUILD_DIR: ${{ matrix.target_build_dir }}
          SDK_IMAGE: ${{ env.SDK_IMAGE }}
          V: s

      - name: Stage binary feed
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          source_dir="artifacts/bin/packages/${PACKAGE_ARCH}/${FEED_NAME}"
          target_dir="publish/${OPENWRT_VERSION}/${PACKAGE_ARCH}/${FEED_NAME}"

          test -f "${source_dir}/packages.adb"
          mkdir -p "${target_dir}"
          cp -a "${source_dir}/." "${target_dir}/"

      - name: Upload architecture feed
        uses: actions/upload-artifact@v7
        with:
          name: feed-${{ matrix.id }}
          path: publish/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.id }}
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7
