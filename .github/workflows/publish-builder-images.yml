name: Publish OpenWrt SDK + Rust builder images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/actions/openwrt-sdk-rust/Dockerfile
      - .github/actions/openwrt-sdk-rust/entrypoint.sh
      - .github/workflows/publish-builder-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-openwrt-rust-builders
  cancel-in-progress: true

env:
  OPENWRT_VERSION: 25.12.5
  RUST_VERSION: 1.94.0
  BUILDER_IMAGE: ghcr.io/reticulum-spb/openwrt-rns-sdk-rust

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bcm27xx-bcm2710
            rust_target: aarch64-unknown-linux-musl
          - target: rockchip-armv8
            rust_target: aarch64-unknown-linux-musl
          - target: sunxi-cortexa7
            rust_target: armv7-unknown-linux-musleabihf
          - target: kirkwood-generic
            rust_target: armv5te-unknown-linux-musleabi

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish builder image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .github/actions/openwrt-sdk-rust
          push: true
          tags: ${{ env.BUILDER_IMAGE }}:${{ matrix.target }}-${{ env.OPENWRT_VERSION }}-rust-${{ env.RUST_VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            OPENWRT_SDK_IMAGE=ghcr.io/openwrt/sdk
            OPENWRT_SDK_TAG=${{ matrix.target }}-${{ env.OPENWRT_VERSION }}
            RUST_TARGET=${{ matrix.rust_target }}
            RUST_VERSION=${{ env.RUST_VERSION }}
          cache-from: type=gha,scope=builder-${{ matrix.target }}-${{ env.OPENWRT_VERSION }}-rust-${{ env.RUST_VERSION }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.target }}-${{ env.OPENWRT_VERSION }}-rust-${{ env.RUST_VERSION }}
