name: OpenWrt SDK with prebuilt Rust
description: Build OpenWrt packages with a published SDK and Rust builder image
author: RNS Gate

runs:
  using: composite
  steps:
    - name: Resolve paths
      id: inputs
      shell: bash
      run: |
        echo "artifacts_dir=${ARTIFACTS_DIR:-$GITHUB_WORKSPACE}" >> "$GITHUB_OUTPUT"
        echo "cache_dir=${CACHE_DIR:-$RUNNER_TEMP/openwrt-cache/$OPENWRT_SDK_TAG}" >> "$GITHUB_OUTPUT"
        echo "feed_dir=${FEED_DIR:-$GITHUB_WORKSPACE}" >> "$GITHUB_OUTPUT"
        echo "image=${BUILDER_IMAGE:?BUILDER_IMAGE must be set}" >> "$GITHUB_OUTPUT"
        echo "image_tag=${OPENWRT_SDK_TAG:?OPENWRT_SDK_TAG must be set}-rust-${RUST_VERSION:?RUST_VERSION must be set}" >> "$GITHUB_OUTPUT"

    - name: Give the builder container access to the workspace
      shell: bash
      run: |
        mkdir -p \
          ${{ steps.inputs.outputs.cache_dir }}/dl \
          ${{ steps.inputs.outputs.cache_dir }}/cargo-target
        sudo chown -R 1000:1000 \
          ${{ steps.inputs.outputs.artifacts_dir }} \
          ${{ steps.inputs.outputs.cache_dir }} \
          ${{ steps.inputs.outputs.feed_dir }}

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Pull builder image
      id: pull
      continue-on-error: true
      shell: bash
      run: docker pull ${{ steps.inputs.outputs.image }}:${{ steps.inputs.outputs.image_tag }}

    - name: Set up Docker Buildx for fallback
      if: steps.pull.outcome == 'failure'
      uses: docker/setup-buildx-action@v4

    - name: Build builder image as fallback
      if: steps.pull.outcome == 'failure'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: ${{ github.action_path }}
        push: false
        load: true
        tags: ${{ steps.inputs.outputs.image }}:${{ steps.inputs.outputs.image_tag }}
        build-args: |
          OPENWRT_SDK_IMAGE=ghcr.io/openwrt/sdk
          OPENWRT_SDK_TAG=${{ env.OPENWRT_SDK_TAG }}
          RUST_TARGET=${{ env.RUST_TARGET }}
          RUST_VERSION=${{ env.RUST_VERSION }}
        cache-from: type=gha,scope=builder-${{ env.OPENWRT_SDK_TAG }}-rust-${{ env.RUST_VERSION }}
        cache-to: type=gha,mode=max,scope=builder-${{ env.OPENWRT_SDK_TAG }}-rust-${{ env.RUST_VERSION }}

    - name: Build packages
      shell: bash
      run: |
        docker run --rm \
          --env BUILD \
          --env BUILD_LOG \
          --env EXTRA_FEEDS \
          --env FEEDNAME \
          --env IGNORE_ERRORS \
          --env KEY_BUILD \
          --env PRIVATE_KEY \
          --env NO_DEFAULT_FEEDS \
          --env NO_REFRESH_CHECK \
          --env NO_SHFMT_CHECK \
          --env PACKAGES \
          --env INDEX \
          --env RNS_EXTERNAL_RUST \
          --env V \
          -v ${{ steps.inputs.outputs.artifacts_dir }}:/artifacts \
          -v ${{ steps.inputs.outputs.cache_dir }}/dl:/builder/dl \
          -v ${{ steps.inputs.outputs.cache_dir }}/cargo-target:/builder/build_dir/${OPENWRT_BUILD_DIR:?OPENWRT_BUILD_DIR must be set}/rns-cargo-target \
          -v ${{ steps.inputs.outputs.feed_dir }}:/feed \
          ${{ steps.inputs.outputs.image }}:${{ steps.inputs.outputs.image_tag }}

    - name: Restore artifact ownership
      if: always()
      shell: bash
      run: sudo chown -R --reference=${{ steps.inputs.outputs.artifacts_dir }}/.. ${{ steps.inputs.outputs.artifacts_dir }}

    - name: Restore feed ownership
      if: always()
      shell: bash
      run: sudo chown -R --reference=${{ steps.inputs.outputs.feed_dir }}/.. ${{ steps.inputs.outputs.feed_dir }}

    - name: Restore cache ownership
      if: always()
      shell: bash
      run: sudo chown -R --reference=${{ steps.inputs.outputs.cache_dir }}/.. ${{ steps.inputs.outputs.cache_dir }}
